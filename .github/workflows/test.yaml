name: Test

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Hook unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Run hook unit tests
        run: sh test/hooks_test.sh

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Run end-to-end tests
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: bash test/e2e/run.sh

      - name: Upload logs of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
