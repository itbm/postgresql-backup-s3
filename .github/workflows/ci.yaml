name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: ShellCheck
        run: shellcheck -s busybox -S warning *.sh test/*.sh

      - name: Run tests
        run: sh test/hooks_test.sh

  go:
    name: go-cron
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: postgresql-backup-s3:ci

      - name: Run tests inside the image (BusyBox sh)
        run: docker run --rm -v "$PWD:/src:ro" -e SCRIPT_SHELL=sh postgresql-backup-s3:ci sh /src/test/hooks_test.sh

      - name: Check go-cron starts
        run: |
          out=$(docker run --rm postgresql-backup-s3:ci go-cron 'not a schedule' /bin/true 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'Invalid schedule format'
