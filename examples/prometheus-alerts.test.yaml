# Unit tests for prometheus-alerts.yaml. Run them with:
#   promtool test rules prometheus-alerts.test.yaml
#
# Each instance is one backup target with a daily backup at 02:00 (minute 120,
# then every 1440 minutes). Instance names describe the scenario:
#   oneshot-*  one run per process, such as a Kubernetes CronJob: each run
#              leaves a single sample, and nothing in between.
#   sched-*    a long-lived container with SCHEDULE: samples continue
#              between runs.
#   *-ok       every backup succeeds.
#   *-pods     every run comes from a new pod, with a k8s_pod_name label.
#   *-upgrade  the image is upgraded, which changes otel_scope_version.
#   *-never    no backup has ever succeeded.
#   *-failing  backups succeed once, then fail every day.
#   *-drop     the backup size falls from 1 GB to 300 MB on day 4.
#   *-stopped  the target stops reporting after day 2.
# oneshot-ok also reports a restore, which must not affect backup alerts.
rule_files:
  - prometheus-alerts.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'pgbackup_last_success_timestamp_seconds{job="pgbackup",instance="oneshot-ok",pgbackup_operation="backup"}'
